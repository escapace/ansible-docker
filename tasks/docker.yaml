---
- name: create docker configuration and unit directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /etc/docker
    - /etc/systemd/system/docker.service.d

- name: configure docker without replacing the vendor command line
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
    validate: /usr/bin/dockerd --validate --config-file %s
  when: docker_daemon_binary.stat.executable | default(false)
  notify: docker restart daemon

- name: persist native nftables forwarding prerequisites
  ansible.builtin.copy:
    content: |
      # managed by escapace.docker
      net.ipv4.ip_forward = 1
      net.ipv6.conf.all.forwarding = 1
    dest: /etc/sysctl.d/99-docker-forwarding.conf
    owner: root
    group: root
    mode: "0644"
  notify: docker apply forwarding

# At Docker startup, firewalld can log NAME_CONFLICT for docker-forwarding when
# Docker requests an already-existing policy. This is benign if the expected
# policy is active; leave the Docker-owned policy intact.
- name: order docker after discovered services
  ansible.builtin.template:
    src: docker-dependencies.conf.j2
    dest: /etc/systemd/system/docker.service.d/10-dependencies.conf
    owner: root
    group: root
    mode: "0644"
  notify:
    - docker daemon-reload
    - docker restart daemon

- name: enable docker at boot without starting it
  ansible.builtin.systemd_service:
    name: docker.service
    enabled: true
  when: docker_daemon_binary.stat.executable | default(false)
