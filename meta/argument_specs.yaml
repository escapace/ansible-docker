---
argument_specs:
  main:
    short_description: configure rootful docker on el10 without starting inactive services
    options:
      docker_users:
        description: existing usernames to add to the docker group without removing other memberships
        type: list
        default: []
        elements: str
      docker_tailscale_integration:
        description: opt in to docker forwarding through a discovered tailscale firewalld zone
        type: bool
        default: false
      docker_build_cache_min_free_space:
        description: positive binary byte-size target for filesystem free space reclaimed from build cache
        type: str
        default: "10GB"
      docker_dangling_image_prune_after:
        description: positive whole-hour age cutoff for daily dangling image cleanup; empty disables it
        type: str
        default: "168h"
      docker_storage_device:
        description: non-empty absolute /dev/ block-device path enables dedicated storage; empty skips configuration
        type: str
        default: ""
      docker_storage_volume_group:
        description: volume group owned by the docker storage configuration
        type: str
        default: docker
      docker_bridge_ipv4:
        description: private ipv4 gateway and prefix for the default bridge
        type: str
        default: 172.17.0.1/16
      docker_bridge_ipv6_subnet:
        description: canonical private ipv6 /64 outside tailscale; false or an empty string disables default bridge ipv6
        type: raw
        default: fd3b:7a4e:6b20:1::/64
