---
- name: converge
  hosts: all
  pre_tasks:
    - name: install image preparation and native firewall test prerequisites
      ansible.builtin.package:
        name:
          - systemd
          - systemd-udev
          - firewalld
        state: present

    - name: prepare native optional integration fixtures without starting services
      ansible.builtin.import_tasks: tasks/fixtures.yaml
  roles:
    - role: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | basename }}"
